name: Build & Package

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and Build
        run: cmake -B build && cmake --build build --config Release

      - name: Verify universal binary
        run: |
          test -d externals/bbb.psn.receiver.mxo
          test -d externals/bbb.psn.sender.mxo
          lipo -info externals/bbb.psn.receiver.mxo/Contents/MacOS/bbb.psn.receiver | grep -E 'x86_64.*arm64|arm64.*x86_64'
          lipo -info externals/bbb.psn.sender.mxo/Contents/MacOS/bbb.psn.sender | grep -E 'x86_64.*arm64|arm64.*x86_64'

      - name: Sign macOS externals
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: .github/scripts/macos-direct-distribution.sh sign externals

      - name: Archive macOS externals
        shell: bash
        run: .github/scripts/macos-direct-distribution.sh archive externals "$RUNNER_TEMP/macos-externals.zip"

      - name: Upload macOS externals
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-macos-externals
          path: ${{ runner.temp }}/macos-externals.zip
          retention-days: 14

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and Build
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 && cmake --build build --config Release

      - name: Upload Windows externals
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows-externals
          path: externals/
          retention-days: 14

  package:
    permissions:
      contents: write
    needs: [build-macos, build-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS externals
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-macos-externals
          path: ${{ runner.temp }}/macos-artifact

      - name: Restore signed macOS externals
        shell: bash
        run: .github/scripts/macos-direct-distribution.sh extract "$RUNNER_TEMP/macos-artifact/macos-externals.zip" "dist/${{ github.event.repository.name }}"


      - name: Download Windows externals
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows-externals
          path: dist/${{ github.event.repository.name }}/externals/

      - name: Assemble package
        run: |
          mkdir -p "dist/${{ github.event.repository.name }}/"
          cp package-info.json "dist/${{ github.event.repository.name }}/"
          cp README.md "dist/${{ github.event.repository.name }}/"
          cp -r help "dist/${{ github.event.repository.name }}/"
          cp -r patchers "dist/${{ github.event.repository.name }}/"
          cp LICENSE "dist/${{ github.event.repository.name }}/" 2>/dev/null || true

      - name: Create macOS-preserving archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ditto -c -k --keepParent "${{ github.event.repository.name }}" "${{ github.event.repository.name }}-latest-build.zip"

      - name: Notarize and verify public archive
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
        run: .github/scripts/macos-direct-distribution.sh notarize-and-verify "dist/${{ github.event.repository.name }}-latest-build.zip" "${{ github.event.repository.name }}"

      - name: Generate archive checksum
        shell: bash
        run: .github/scripts/macos-direct-distribution.sh checksum "dist/${{ github.event.repository.name }}-latest-build.zip"

      - name: Upload latest build zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-latest-build-zip
          path: |
            dist/${{ github.event.repository.name }}-latest-build.zip
            dist/${{ github.event.repository.name }}-latest-build.zip.sha256
          retention-days: 30

      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ github.sha }}"
          git push --force origin refs/tags/latest
          if ! gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create latest \
              --repo "${{ github.repository }}" \
              --title "Latest CI Build" \
              --notes "Automated latest build from main."
          fi
          gh release edit latest \
            --repo "${{ github.repository }}" \
            --title "Latest CI Build" \
            --notes "Automated latest build from main commit ${{ github.sha }}."
          gh release upload latest \
            "dist/${{ github.event.repository.name }}-latest-build.zip" \
            "dist/${{ github.event.repository.name }}-latest-build.zip.sha256" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Upload to tagged Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ github.event.repository.name }}-latest-build.zip
            dist/${{ github.event.repository.name }}-latest-build.zip.sha256
